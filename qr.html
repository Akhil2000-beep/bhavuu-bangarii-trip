<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bhavuu Bangarii Trip — Heart QR</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#ffd5e5,#fff5f9,#ffc1d9);font-family:system-ui,sans-serif;color:#6a2142;text-align:center}
main{padding:24px}h1{color:#d7194f}#wrap{display:inline-block;padding:20px;background:#fff;border-radius:28px;box-shadow:0 15px 45px #8b315233}canvas{width:min(78vw,430px);height:auto;display:block}.name{font-weight:800;letter-spacing:2px;color:#d7194f;margin-top:18px}.small{font-size:13px;opacity:.75;max-width:550px;margin:12px auto}
</style></head><body><main><h1>💗 BHAVUU BANGARII TRIP 💗</h1><div id="wrap"><canvas id="c"></canvas><div class="name">SCAN ME</div></div><p class="small">This QR encodes the exact address of this page. Upload the whole folder first, then open this file on the live website and save/print the QR.</p>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script>
const url=location.origin+location.pathname.replace(/qr\.html$/,'');
QRCode.toCanvas(document.getElementById('c'),url,{errorCorrectionLevel:'H',margin:2,width:720},function(e){
 if(e) return;
 const c=document.getElementById('c'),x=c.getContext('2d'),w=c.width;
 x.fillStyle='#fff';x.beginPath();x.arc(w/2,w/2,58,0,Math.PI*2);x.fill();
 x.font='48px serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#e91e63';x.fillText('♥',w/2,w/2+2);
});
</script></main></body></html>
